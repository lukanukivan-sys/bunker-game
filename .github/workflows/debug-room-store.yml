name: Debug room store

on:
  pull_request:

permissions:
  contents: read

jobs:
  room-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: node --check lib/room_store.js
      - run: node --require ./test_runtime_setup.js test_room_store_safety_126.js
