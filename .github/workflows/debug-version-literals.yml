name: Debug version literals

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const files = fs.readdirSync('.')
            .filter((name) => /^test_.*\.js$/.test(name))
            .filter((name) => fs.readFileSync(name, 'utf8').includes('1.2.10'))
            .sort();
          process.stdout.write(`files=${JSON.stringify(files)}\n`);
          NODE

  literal:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    name: version literal ${{ matrix.file }}
    steps:
      - run: echo "${{ matrix.file }} still contains a hard-coded product version"
