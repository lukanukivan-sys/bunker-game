name: Apply platform store safety patch

on:
  push:
    branches:
      - agent/1.2.11-platform-store-safety
    paths:
      - scripts/apply_platform_store_safety_211.js
      - .github/workflows/apply-platform-store-safety.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/1.2.11-platform-store-safety
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact patch
        run: node scripts/apply_platform_store_safety_211.js

      - name: Verify package
        run: npm run verify

      - name: Remove one-time patch files
        run: |
          rm scripts/apply_platform_store_safety_211.js
          rm .github/workflows/apply-platform-store-safety.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform.js package.json scripts/apply_platform_store_safety_211.js .github/workflows/apply-platform-store-safety.yml
          git commit -m "data: enforce strict platform store loading"
          git push origin HEAD:agent/1.2.11-platform-store-safety
