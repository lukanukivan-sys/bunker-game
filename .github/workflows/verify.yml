name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          if npm test > test-output.log 2>&1; then
            tail -n 30 test-output.log
          else
            tail -n 140 test-output.log
            exit 1
          fi

      - name: Audit content and abilities
        shell: bash
        run: |
          if npm run audit > audit-output.log 2>&1; then
            tail -n 40 audit-output.log
          else
            tail -n 120 audit-output.log
            exit 1
          fi

      - name: Check rules and documentation synchronization
        env:
          RULEBOOK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RULEBOOK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RULEBOOK_SYNC_STRICT: "1"
        run: npm run audit:rulebook:sync

      - name: Check syntax
        run: npm run check:syntax

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build image
        run: docker build -t skhovyshche:${{ github.sha }} .

      - name: Start container
        run: docker run --rm -d --name skhovyshche-smoke -p 3000:3000 skhovyshche:${{ github.sha }}

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs skhovyshche-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker stop skhovyshche-smoke || true
