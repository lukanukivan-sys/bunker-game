name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          if npm test > test-output.log 2>&1; then
            tail -n 30 test-output.log
          else
            tail -n 140 test-output.log
            exit 1
          fi

      - name: Audit content and abilities
        shell: bash
        run: |
          if npm run audit > audit-output.log 2>&1; then
            tail -n 40 audit-output.log
          else
            tail -n 120 audit-output.log
            exit 1
          fi

      - name: Check syntax
        run: npm run check:syntax

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t skhovyshche:${{ github.sha }} .

      - name: Start container
        run: |
          docker run --rm -d \
            --name skhovyshche-smoke \
            -e PERSISTENCE_MODE=ephemeral-allowed \
            -p 3000:3000 \
            skhovyshche:${{ github.sha }}

      - name: Verify liveness and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/ready > ready.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health > health.json
          curl --fail --silent http://127.0.0.1:3000/api/ready > ready.json
          node -e "
            const fs = require('node:fs');
            const health = JSON.parse(fs.readFileSync('health.json'));
            const ready = JSON.parse(fs.readFileSync('ready.json'));
            if (!health.ok || health.status !== 'live') process.exit(1);
            if (!ready.ready || ready.persistence.policy !== 'ephemeral-allowed') process.exit(1);
            if (ready.persistence.mode !== 'ephemeral' || ready.persistence.durable !== false) process.exit(1);
          "

      - name: Verify persistent mode fails closed
        run: |
          docker run --rm -d \
            --name skhovyshche-persistent-failure \
            -e PERSISTENCE_MODE=persistent-required \
            -e DATA_DIR=/proc/skhovyshche-data \
            -e EXPECTED_DATA_DIR=/proc/skhovyshche-data \
            -p 3001:3000 \
            skhovyshche:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > persistent-health.json; then
              break
            fi
            sleep 1
          done
          test "$(curl --silent --output persistent-ready.json --write-out '%{http_code}' http://127.0.0.1:3001/api/ready)" = "503"
          node -e "
            const fs = require('node:fs');
            const health = JSON.parse(fs.readFileSync('persistent-health.json'));
            const ready = JSON.parse(fs.readFileSync('persistent-ready.json'));
            if (!health.ok || health.status !== 'live') process.exit(1);
            if (ready.ready || ready.ok) process.exit(1);
          "

      - name: Stop containers
        if: always()
        run: |
          docker stop skhovyshche-smoke || true
          docker stop skhovyshche-persistent-failure || true
