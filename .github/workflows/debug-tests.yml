name: Debug individual tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const excluded = new Set(['run_all_tests.js', 'test_support.js', 'test_runtime_setup.js']);
          const files = fs.readdirSync('.').filter((name) => /^test_.*\.js$/.test(name) && !excluded.has(name)).sort();
          process.stdout.write(`files=${JSON.stringify(files)}\n`);
          NODE

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    name: test ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.file }}
        env:
          NODE_ENV: test
          TEST_RUNNER: "1"
        run: node --require ./test_runtime_setup.js "${{ matrix.file }}"
